      (function() {
        function triggerVibration() {
          if (typeof navigator !== "undefined" && "vibrate" in navigator) {
            try {
              navigator.vibrate(250);
              setTimeout(function() {
                try { navigator.vibrate([150, 80, 200]); } catch(err) {}
              }, 150);
            } catch(e) {}
          }
        }

        ['touchstart', 'pointerdown', 'mousedown', 'click'].forEach(function(evtType) {
          document.addEventListener(evtType, function(e) {
            var target = e.target;
            if (target && target.closest && (target.closest('.curtain-seal') || target.closest('.curtain-container') || target.closest('button'))) {
              triggerVibration();
            }
          }, { capture: true, passive: true });
